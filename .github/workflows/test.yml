name: Mini NPU verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 main.py --mode 2
